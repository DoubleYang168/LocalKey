name: Windows build and core checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check public files and links
        run: ./scripts/check-publication.ps1
      - name: Build and run core tests
        run: ./test.ps1
      - name: Build release archives
        run: ./scripts/package.ps1
      - name: Verify archives and checksums
        run: ./scripts/check-publication.ps1 -CheckPackages
      - name: Upload packages for review
        uses: actions/upload-artifact@v4
        with:
          name: LocalKey-windows-and-source
          path: |
            artifacts/releases/*.exe
            artifacts/releases/*.zip
            artifacts/releases/SHA256SUMS.txt
            artifacts/releases/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 7
